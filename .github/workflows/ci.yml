name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check
      - run: uv run black --check zhyonlineedu tests scripts migrations manage.py
      - run: uv run mypy
      - run: uv run python scripts/check_dialect_compat.py
      - run: uv run python scripts/check_migration_caps.py
      - run: uv run python scripts/check_progress_monotonic.py
      - run: uv run python scripts/check_version.py
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhy
          POSTGRES_PASSWORD: zhy
          POSTGRES_DB: zhy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhy" --health-interval 10s
          --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zhy
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      ZHY_TEST_PG_DSN: postgresql+psycopg://zhy:zhy@127.0.0.1:5432/zhy
      ZHY_TEST_MYSQL_DSN: mysql+pymysql://root:root@127.0.0.1:3306/zhy?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev --extra pg
      - name: 三库回归（迁移 + 方言矩阵 + UPSERT + 安装 + 插件生命周期）
        run: >-
          uv run pytest
          tests/test_migrations.py
          tests/test_dialect_matrix.py
          tests/test_upsert.py
          tests/test_install.py
          tests/test_probe.py
          tests/test_plugin_multidb.py
          -q

  gate:
    if: always()
    needs: [quality, web, db]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总门禁
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "web=${{ needs.web.result }}"
          echo "db=${{ needs.db.result }}"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.db.result }}" = "success"
