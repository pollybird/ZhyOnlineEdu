name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check
      - run: uv run black --check zhyonlineedu tests scripts migrations manage.py
      - run: uv run mypy
      - run: uv run python scripts/check_dialect_compat.py
      - run: uv run python scripts/check_migration_caps.py
      - run: uv run python scripts/check_progress_monotonic.py
      - run: uv run python scripts/check_version.py
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  gate:
    if: always()
    needs: [quality, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总门禁
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "web=${{ needs.web.result }}"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.web.result }}" = "success"
